name: MATCHER CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: matcher
          POSTGRES_PASSWORD: matcher
          POSTGRES_DB: matcher
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U matcher -d matcher"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGPASSWORD: matcher
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - run: npm run verify:gate
      - run: npm run verify:experience
      - run: npm run verify:marketplace
      - run: npm run lint
      - run: npm run build
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16
          psql --version
      - name: Load MATCHER database schema
        run: |
          psql -h 127.0.0.1 -U matcher -d matcher -v ON_ERROR_STOP=1 -f db/schema.sql
          psql -h 127.0.0.1 -U matcher -d matcher -v ON_ERROR_STOP=1 -f db/migrations/002_domain_integrity.sql
          psql -h 127.0.0.1 -U matcher -d matcher -v ON_ERROR_STOP=1 -f db/migrations/003_identifier_scope_repair.sql
          psql -h 127.0.0.1 -U matcher -d matcher -v ON_ERROR_STOP=1 -f db/migrations/004_purchase_review_gate.sql
      - name: Verify database schema and domain hardening
        run: |
          set -euo pipefail
          psql -h 127.0.0.1 -U matcher -d matcher -v ON_ERROR_STOP=1 <<'SQL'
          select 'freshness_policy' as check_name, count(*) as actual_count from freshness_policy;
          select 'supplier_product_identifier' as check_name, to_regclass('public.supplier_product_identifier') as relation_name;
          select 'identity_hard_block' as check_name, to_regclass('public.identity_hard_block') as relation_name;
          select 'supplier_offer_observation' as check_name, to_regclass('public.supplier_offer_observation') as relation_name;
          select 'supplier_offer_freshness' as check_name, to_regclass('public.supplier_offer_freshness') as relation_name;
          select 'purchase_review' as check_name, to_regclass('public.purchase_review') as relation_name;
          select 'purchase_review_rls' as check_name, exists (
            select 1 from pg_class c join pg_namespace n on n.oid=c.relnamespace
            where n.nspname='public' and c.relname='purchase_review' and c.relrowsecurity
          ) as enabled;
          select 'match_result.hard_block' as check_name, exists (
            select 1 from information_schema.columns
            where table_schema = 'public' and table_name = 'match_result' and column_name = 'hard_block'
          ) as exists;
          select 'identifier_product_scope' as check_name, exists (
            select 1 from pg_indexes
            where schemaname = 'public' and indexname = 'idx_product_identifier_product_scoped'
          ) as exists;
          select 'identifier_global_gtin' as check_name, exists (
            select 1 from pg_indexes
            where schemaname = 'public' and indexname = 'idx_product_identifier_global_gtin'
          ) as exists;
          SQL
          psql -h 127.0.0.1 -U matcher -d matcher -v ON_ERROR_STOP=1 <<'SQL'
          do $matcher_schema_check$
          begin
            if (select count(*) from freshness_policy) <> 3 then
              raise exception 'freshness_policy must contain exactly 3 default metrics';
            end if;
            if to_regclass('public.supplier_product_identifier') is null then
              raise exception 'supplier_product_identifier missing';
            end if;
            if to_regclass('public.identity_hard_block') is null then
              raise exception 'identity_hard_block missing';
            end if;
            if to_regclass('public.supplier_offer_observation') is null then
              raise exception 'supplier_offer_observation missing';
            end if;
            if to_regclass('public.supplier_offer_freshness') is null then
              raise exception 'supplier_offer_freshness missing';
            end if;
            if to_regclass('public.purchase_review') is null then
              raise exception 'purchase_review missing';
            end if;
            if not exists (
              select 1 from pg_class c join pg_namespace n on n.oid=c.relnamespace
              where n.nspname='public' and c.relname='purchase_review' and c.relrowsecurity
            ) then
              raise exception 'purchase_review RLS missing';
            end if;
            if not exists (
              select 1 from information_schema.columns
              where table_schema = 'public' and table_name = 'purchase_review' and column_name = 'decision_snapshot'
            ) then
              raise exception 'purchase_review.decision_snapshot missing';
            end if;
            if not exists (
              select 1 from information_schema.columns
              where table_schema = 'public' and table_name = 'match_result' and column_name = 'hard_block'
            ) then
              raise exception 'match_result.hard_block missing';
            end if;
            if not exists (
              select 1 from pg_indexes
              where schemaname = 'public' and indexname = 'idx_product_identifier_product_scoped'
            ) then
              raise exception 'product-scoped identifier index missing';
            end if;
            if not exists (
              select 1 from pg_indexes
              where schemaname = 'public' and indexname = 'idx_product_identifier_global_gtin'
            ) then
              raise exception 'global GTIN uniqueness index missing';
            end if;
          end $matcher_schema_check$;
          SQL
