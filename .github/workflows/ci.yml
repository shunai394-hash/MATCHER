name: MATCHER CI

on:
  push:
    branches: [main, "feature/**", "ux/**", "claude/**"]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - run: npm run verify:gate
      - run: npm run verify:opportunity
      - run: npm run verify:identity
      - run: npm run verify:experience
      - run: npm run verify:marketplace
      - run: npm run verify:schema
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - name: Ensure PostgreSQL 16 server binaries
        run: |
          if [ ! -x /usr/lib/postgresql/16/bin/initdb ]; then
            sudo apt-get update
            sudo apt-get install -y postgresql-16
          fi
      # Replays db/migrations 001..N, checks the result equals db/schema.sql, applies 006+ on the
      # reported production shape, and checks legacy data survives the reconciliation migration.
      - name: Migrations (history chain == schema.sql, production shape, legacy data)
        run: npm run verify:migrations
      # Loads db/schema.sql (mirror of the live Supabase schema) into a throwaway Postgres,
      # serves it through PostgREST and runs the full ingest → recompute → opportunities scenario.
      - name: End-to-end (Postgres + PostgREST + next start)
        run: npm run test:e2e
